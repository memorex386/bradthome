# lychee's settings for the built site (FR-013, FR-020). CI's links job adds
# --offline and --include-fragments on its command line, to check internal
# links and anchors only. The nightly run reads this file too, and checks the
# external links online.
no_progress = true
max_retries = 2
timeout = 20
# Hosting serves page.html at /page (cleanUrls), so a clean link like
# /vindecoded-agents resolves to its .html file, as it does live.
fallback_extensions = ["html"]
# Hosting serves index.html for /, so a link like /#hopper reads the
# fragment from index.html, as it does live (spec 019).
index_files = ["index.html"]

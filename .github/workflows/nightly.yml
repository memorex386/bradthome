# The nightly checks (spec 003, FR-020, D55, D94): the built site's external
# links, and mutation testing on the safety scripts. Both can fail for reasons
# outside a pull request, so they run on a schedule and by hand, report in the
# run's summary, and never block anything.

name: nightly

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NO_COLOR: '1'

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build the site
        run: pnpm site:build
      - name: Install lychee 0.24.2
        run: |
          curl -sSfL -o "$RUNNER_TEMP/lychee.tar.gz" https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/lychee"
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/lychee"
          echo "$RUNNER_TEMP/lychee" >> "$GITHUB_PATH"
      # lychee exits 2 when a link is broken. The summary step reports them, and
      # its own exit fails the job only when lychee wrote no report.
      - name: Check every external link, online
        run: |
          set +e
          lychee --config lychee.toml --scheme https --scheme http --format json --output "$RUNNER_TEMP/lychee.json" apps/site/dist
          echo "lychee exited $?"
      - name: Report the links
        run: node scripts/ci/nightly-summary.ts links "$RUNNER_TEMP/lychee.json" >> "$GITHUB_STEP_SUMMARY"

  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      # Stryker exits non-zero when a test fails before mutating. The summary
      # says so, with no score, and fails the job.
      - name: Mutate the safety scripts
        run: |
          set +e
          pnpm mutation
          echo "stryker exited $?"
      - name: Report the score
        run: node scripts/ci/nightly-summary.ts mutation reports/mutation/mutation.json >> "$GITHUB_STEP_SUMMARY"

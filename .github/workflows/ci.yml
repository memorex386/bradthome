# CI for every pull request into main and every push to it (spec 002). Each job
# runs one script from scripts/ci/ or one of the repo's own commands, so the
# rules live in code the tests cover. The gate sums up every job, and the
# ruleset requires it from slice 1.5, beside locked-tests / lock.
#
# A draft pull request runs the quick jobs only. The slow ones, the Windows
# tests and the site's e2e, lighthouse, html and links, run once it's ready for
# review and on every push after that, and the gate needs every job before it
# can merge. An edit to the title or description runs only privacy and commits,
# which read that text, and the gate adds the latest code run's results for the
# same commit. Pushes to main run everything (D100).

name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && 'text' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NO_COLOR: '1'

jobs:
  # Spec 003's site checks (FR-007 to FR-014). Each runs one package command,
  # which prints its findings through scripts/ci/site-report.ts. The site
  # builds once, in build, and the jobs after it check that build.
  lint:
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile --loglevel=warn
      - name: Lint the site and the scripts
        run: pnpm lint

  format:
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile --loglevel=warn
      - name: Check the formatting
        run: pnpm format:check

  site-types:
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile --loglevel=warn
      - name: Check the site's types
        run: pnpm site:types

  build:
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile --loglevel=warn
      - name: Build the site
        run: pnpm site:build
      - name: Check firebase.json's Content-Security-Policy matches the build
        run: pnpm csp --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: apps/site/dist
          if-no-files-found: error
          retention-days: 7

  # The page, accessibility, snapshot and header tests, in the pinned
  # Playwright container, by digest (FR-010, FR-011, D46). pnpm test:visual
  # runs the same image on Brad's PC.
  e2e:
    if: github.event.action != 'edited' && github.event.pull_request.draft != true
    needs: [build]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    env:
      BRADTHOME_CONTAINER: '1'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: apps/site/dist
      - name: Install the packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile --loglevel=warn
      - name: Run the end-to-end tests
        run: pnpm test:e2e
      - name: Keep the report and every diff image
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  # Five Lighthouse runs on a phone profile, in the same container, with its
  # Chromium (FR-012).
  lighthouse:
    if: github.event.action != 'edited' && github.event.pull_request.draft != true
    needs: [build]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: apps/site/dist
      - name: Install the packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile --loglevel=warn
      - name: Run Lighthouse against the budgets
        run: pnpm site:lighthouse
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14

  html:
    if: github.event.action != 'edited' && github.event.pull_request.draft != true
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: apps/site/dist
      - name: Install the packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile --loglevel=warn
      - name: Validate every built page
        run: pnpm site:html

  links:
    if: github.event.action != 'edited' && github.event.pull_request.draft != true
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: apps/site/dist
      - name: Install lychee 0.24.2
        run: |
          curl -sSfL -o "$RUNNER_TEMP/lychee.tar.gz" https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/lychee"
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/lychee"
          echo "$RUNNER_TEMP/lychee" >> "$GITHUB_PATH"
      - name: Check every internal link and anchor, offline
        run: |
          corepack enable
          pnpm site:links

  types:
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile --loglevel=warn
      - name: Type check
        run: pnpm typecheck

  # On a draft, the Windows leg reports in without running the tests.
  tests:
    if: github.event.action != 'edited'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      FULL: ${{ matrix.os == 'ubuntu-24.04' || github.event.pull_request.draft != true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Say why a draft skips the Windows tests
        if: env.FULL != 'true'
        run: echo "A draft runs the Windows tests once it's ready for review."
      - name: Install the packages
        if: env.FULL == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile --loglevel=warn
      - name: Install gitleaks 8.30.1 (Linux)
        if: runner.os == 'Linux' && env.FULL == 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Install gitleaks 8.30.1 (Windows)
        if: runner.os == 'Windows' && env.FULL == 'true'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          Invoke-WebRequest -Uri https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw "gitleaks.zip has SHA-256 $hash, not the pinned one" }
          $dir = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Expand-Archive -Path $zip -DestinationPath $dir
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      # Spec 001's install test clones the repo, site included, and expects the
      # setup check to pass, which needs Docker to answer (FR-022). The Windows
      # runner has Docker installed with its engine stopped.
      - name: Start Docker (Windows)
        if: runner.os == 'Windows' && env.FULL == 'true'
        shell: pwsh
        run: |
          Start-Service docker
          docker version --format '{{.Server.Version}}'
      - name: Tests
        if: env.FULL == 'true'
        run: pnpm test

  trace:
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Trace every locked spec
        run: node scripts/ci/trace-all.ts

  privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The checkout fetches one commit. The history comes quietly, so the log
      # never lists branch names, which could hold a private term (SC-003).
      - name: Fetch the history quietly
        env:
          TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git fetch --quiet --no-tags --unshallow origin
      # The list goes to this step and to the commits, secrets and hygiene
      # steps, which hide a place that holds a term (D87). On Dependabot's runs
      # the same name reads Dependabot's copy of the secret.
      - name: Scan for private terms and addresses
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: node scripts/ci/privacy.ts

  secrets:
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The checkout fetches one commit. The history comes quietly, so the log
      # never lists branch names, which could hold a private term (SC-003).
      - name: Fetch the history quietly
        env:
          TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git fetch --quiet --no-tags --unshallow origin
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan every commit for secrets
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: node scripts/ci/secrets.ts

  commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The checkout fetches one commit. The history comes quietly, so the log
      # never lists branch names, which could hold a private term (SC-003).
      - name: Fetch the history quietly
        env:
          TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git fetch --quiet --no-tags --unshallow origin
      - name: Install the packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile --loglevel=warn
      - name: Lint the title and every commit
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: node scripts/ci/commits.ts

  hygiene:
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The checkout fetches one commit. The history comes quietly, so the log
      # never lists branch names, which could hold a private term (SC-003).
      - name: Fetch the history quietly
        env:
          TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git fetch --quiet --no-tags --unshallow origin
      - name: Check line endings, whitespace and copies
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: node scripts/ci/hygiene.ts

  # needs gives one result for the tests matrix, so the gate reads each check's
  # own result from the run's jobs, with a read-only token.
  gate:
    needs: [lint, format, site-types, build, e2e, lighthouse, html, links, types, tests, trace, privacy, secrets, commits, hygiene]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Sum up every job
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/gate.ts

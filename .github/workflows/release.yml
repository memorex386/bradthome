# Releases a tagged commit of main to bradthome.com (spec 008, issue #29,
# D113). Run it by hand on a vX.Y.Z tag; docs/release.md is the runbook.
#
# Four jobs, each with only what it needs. tag checks the tag, and build
# builds it in the pinned container, with no sign-in. stage signs in as the preview account, which already
# deploys channels (D91), puts the build on the channel release with the
# live config, and runs the pre-release check against bradthome.com. release
# waits in the production environment for Brad's approval, signs in as
# release-deployer, which only that environment can use, and makes the staged
# version live. It installs nothing and runs one repo script with Node.

name: release

on:
  workflow_dispatch:
    inputs:
      words-may-change:
        description: Which pages' words may differ from the live site's
        type: choice
        options: [none, home, home-and-essay]
        default: none

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NO_COLOR: '1'

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check the run is on a release tag on main
        run: node scripts/release/tag-check.ts

  # The build is ci / build's: in the pinned Playwright container, where
  # WeasyPrint prints the résumé PDFs and Astro's CSP hashes match
  # firebase.json's (spec 019). Since v2.0 a release serves every page.
  build:
    needs: [tag]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile --loglevel=warn
      - name: Install WeasyPrint, which prints the résumé PDFs
        run: pnpm printer:install
      - name: Build the site
        # Leaves interview prep out until v2.2 (spec 024, D190).
        env:
          BRADTHOME_RELEASE: '1'
        run: pnpm site:build
      - name: Check firebase.json's Content-Security-Policy matches the build
        run: pnpm csp --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-site
          path: apps/site/dist
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.stage.outputs.version }}
      url: ${{ steps.stage.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-site
          path: apps/site/dist
      # Only the CLI, from scripts/ci/firebase-cli's lockfile, as the preview
      # installs it, so none of the site's packages runs while the job holds a
      # Google sign-in.
      - name: Install the Firebase CLI
        run: |
          corepack enable
          mkdir -p "$RUNNER_TEMP/firebase-cli"
          cp scripts/ci/firebase-cli/package.json scripts/ci/firebase-cli/pnpm-lock.yaml scripts/ci/firebase-cli/pnpm-workspace.yaml "$RUNNER_TEMP/firebase-cli/"
          pnpm add --dir="$RUNNER_TEMP/firebase-cli" firebase-tools@15.34.2 --frozen-lockfile --loglevel=warn
          echo "$RUNNER_TEMP/firebase-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Stage the build and check it against bradthome.com
        id: stage
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_PREVIEW_SERVICE_ACCOUNT: ${{ vars.GCP_PREVIEW_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          WORDS_MAY_CHANGE: ${{ inputs.words-may-change }}
        run: node scripts/release/stage.ts

  release:
    needs: [stage]
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://bradthome.com
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Make the staged version live and prove it's served
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_RELEASE_SERVICE_ACCOUNT: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          RELEASE_VERSION: ${{ needs.stage.outputs.version }}
        run: node scripts/release/release.ts

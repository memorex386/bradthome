name: evals

# The chat's eval run (spec 023, D192, D193): frozen cases on the real model,
# in the bradthome-evals workspace. It's the only place the evals key is read.
# Since spec 037 (D228), a push to a branch named evals/… runs a changed run,
# only the cases new or edited since the last full run, and uploads
# apps/evals/changed.json; a run by hand with full set asks every case and
# uploads apps/evals/results.json. Either uploads its file even when a case
# fails, and fails when the run misses its bar. It deploys nothing.

on:
  push:
    branches: ['evals/**']
  workflow_dispatch:
    inputs:
      full:
        description: Ask every case, not only the new and edited ones (D228)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile --loglevel=warn
      - name: Run the evals
        env:
          ANTHROPIC_EVALS_KEY: ${{ secrets.ANTHROPIC_EVALS_KEY }}
          EVALS_MODE: ${{ inputs.full && 'full' || 'changed' }}
        run: pnpm evals
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-results
          path: apps/evals/${{ inputs.full && 'results' || 'changed' }}.json
          if-no-files-found: error
          retention-days: 30

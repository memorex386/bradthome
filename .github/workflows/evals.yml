name: evals

# The chat's eval run (spec 023, D192, D193): every frozen case on the real
# model, in the bradthome-evals workspace. It's the only place the evals key
# is read. A push to a branch named evals/… starts it, or a run by hand. It
# uploads apps/evals/results.json even when a case fails, and fails when one
# does (D197). It deploys nothing.

on:
  push:
    branches: ['evals/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile --loglevel=warn
      - name: Run the evals
        env:
          ANTHROPIC_EVALS_KEY: ${{ secrets.ANTHROPIC_EVALS_KEY }}
        run: pnpm evals
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-results
          path: apps/evals/results.json
          if-no-files-found: error
          retention-days: 30

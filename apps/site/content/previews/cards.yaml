# The hand-written link previews (spec 016, D48). LinkedIn and Google Play
# offer no public API, and the site never scrapes them, so these cards are
# written by hand. Each title is its job or project file's name, or Brad's
# name for LinkedIn, the page's own public title. Each line is copied from a
# public claim, and rows list job and project files with their years. A card
# says when it was written; change the date when its words change.
